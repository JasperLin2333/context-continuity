<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgCC" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#182d3e"/>
      <stop offset="0.55" stop-color="#0f1d29"/>
      <stop offset="1" stop-color="#070e15"/>
    </linearGradient>
    <linearGradient id="stCC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0fcf0"/>
      <stop offset="0.5" stop-color="#80d5c7"/>
      <stop offset="1" stop-color="#4aa89a"/>
    </linearGradient>
    <linearGradient id="accentCC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd8b8"/>
      <stop offset="1" stop-color="#f2aa7d"/>
    </linearGradient>
    <filter id="glowCC" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#80d5c7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="141" fill="url(#bgCC)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="139.5" fill="none" stroke="#80d5c7" stroke-opacity="0.25" stroke-width="3"/>
  
  <!-- Interlocking Handoff Cards -->
  <g fill="none" stroke="url(#stCC)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowCC)">
    <!-- First card (Agent A) -->
    <rect x="136" y="136" width="160" height="200" rx="36"/>
    <!-- Second overlapping card (Agent B / Continuous Handoff) -->
    <rect x="216" y="176" width="160" height="200" rx="36"/>
  </g>
  <!-- Transfer flow link dot -->
  <circle cx="340" cy="176" r="14" fill="url(#accentCC)" filter="url(#glowCC)"/>
  <circle cx="172" cy="336" r="14" fill="url(#accentCC)" filter="url(#glowCC)"/>
</svg>