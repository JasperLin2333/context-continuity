<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Context Continuity：换个 Agent，工作接得上</title>
  <desc id="desc">接手工作的 Agent 按需读取项目中的当前目标、判断依据与已确认决定，保留必要的来源和取舍，将结果回写，让理解与工作持续传递。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172737"/><stop offset="1" stop-color="#0b141f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#223b49"/><stop offset="1" stop-color="#172b37"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#456472" opacity=".25"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto-start-reverse"><path d="m2 1 4 4-4 4" stroke="#80d5c7" stroke-width="1.5" fill="none"/></marker>
  </defs>
  <rect width="1440" height="720" rx="24" fill="url(#bg)"/>
  <rect x="696" y="30" width="714" height="660" fill="url(#dots)"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <g transform="translate(72 62)" fill="none" stroke="#80d5c7" stroke-width="3.5">
      <rect x="0" y="0" width="25" height="30" rx="8"/><rect x="15" y="12" width="25" height="30" rx="8"/>
    </g>
    <text x="132" y="91" fill="#dcebe9" font-size="24" font-weight="600" letter-spacing="2">CONTEXT CONTINUITY</text>
    <text x="72" y="226" fill="#f5f4ee" font-size="74" font-weight="700">换个 Agent，</text>
    <text x="72" y="322" fill="#80d5c7" font-size="74" font-weight="700">工作接得上。</text>
    <text x="76" y="393" fill="#b3c3ca" font-size="27">把目标、依据和决定，交给下一位。</text>
    <path d="M76 444h56" stroke="#f2aa7d" stroke-width="4" stroke-linecap="round"/>
    <text x="76" y="500" fill="#e1e8e8" font-size="27">保留判断依据，让已确认的决定继续生效。</text>
    <rect x="72" y="581" width="490" height="58" rx="29" fill="#ffffff" fill-opacity=".045" stroke="#38505e"/>
    <text x="317" y="618" text-anchor="middle" fill="#a9c4c9" font-size="24">跨会话　 /　 跨 Agent　 /　 跨工具</text>

    <g fill="#1d303e" stroke="#3b5563">
      <rect x="748" y="147" width="174" height="88" rx="16"/>
      <rect x="956" y="147" width="174" height="88" rx="16"/>
      <rect x="1164" y="147" width="174" height="88" rx="16"/>
    </g>
    <g fill="#e4eeed" font-size="27" text-anchor="middle" font-weight="600">
      <text x="835" y="201">Agent A</text><text x="1043" y="201">Agent B</text><text x="1251" y="201">下一位</text>
    </g>
    <g stroke="#80d5c7" stroke-width="2" fill="none" opacity=".75">
      <path d="M835 247v36h176"/><path d="M1251 247v36h-176"/>
      <path d="M1043 246v78" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <rect x="876" y="265" width="334" height="34" rx="17" fill="#14232e"/>
    <text x="1043" y="289" fill="#80d5c7" font-size="22" text-anchor="middle">按需读取　·　修改回写</text>
    <path d="m1037 254 6-7 6 7m-12 62 6 7 6-7" stroke="#80d5c7" stroke-width="2" fill="none"/>

    <rect x="748" y="343" width="590" height="231" rx="20" fill="url(#card)" stroke="#52796f"/>
    <rect x="748" y="343" width="6" height="231" rx="3" fill="#80d5c7"/>
    <text x="783" y="391" fill="#f4f4eb" font-size="29" font-weight="600">接续所需的当前有效信息</text>
    <path d="M783 415h519" stroke="#3a535e"/>
    <g font-size="25">
      <text x="786" y="458" fill="#a3b8be">当前目标</text><text x="1022" y="458" fill="#deebe7">本轮范围与约束</text>
      <text x="786" y="499" fill="#a3b8be">判断依据</text><text x="1022" y="499" fill="#deebe7">事实、来源与取舍</text>
      <text x="786" y="540" fill="#a3b8be">已确认决定</text><text x="1022" y="540" fill="#deebe7">有效方向与剩余工作</text>
    </g>
    <text x="1043" y="626" text-anchor="middle" fill="#a0b5ba" font-size="24">接到依据　→　继续行动　→　成果回写</text>
    <text x="1368" y="680" text-anchor="end" fill="#687f8d" font-size="18" letter-spacing="2">A PORTABLE AGENT SKILL</text>
  </g>
</svg>
